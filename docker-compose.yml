version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: marketplace-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketplace
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: adminkusofteng2026/marketplace-platform-backend
    container_name: marketplace-backend
    restart: always
    environment:
      ConnectionStrings__DefaultConnection: "Host=marketplace-db;Port=5432;Database=marketplace;Username=postgres;Password=postgres"
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    image: adminkusofteng2026/marketplace-platform-frontend
    container_name: marketplace-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
