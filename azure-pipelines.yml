# Runs on:
#   - Every PR targeting master or release/v1.0.0 (failing test -> cannot complete PR)
#   - Every push/merge to master or release/v1.0.0 (failing test -> merge not finalised)
#
# Docker image is pushed ONLY on push/merge (not on PR builds).

trigger:
  branches:
    include:
      - master
      # - release/v1.0.0
      - feature/79-infrastructure-layer

pr:
  branches:
    include:
      - master
      # - release/v1.0.0
      - feature/79-infrastructure-layer

pool:
  name: LocalAgentPool

variables:
  buildConfiguration: 'Release'
  imageName: 'adminkusofteng2026/marketplace-platform'
  tag: '$(Build.BuildId)'

steps:

  # ── Backend ────────────────────────────────────────────────────────────────

  # 1. SDK
  - task: UseDotNet@2
    displayName: 'Install .NET 10.x SDK'
    inputs:
      packageType: 'sdk'
      version: '10.x'

  # 2. Restore dependencies
  - task: DotNetCoreCLI@2
    displayName: 'Restore dependencies'
    inputs:
      command: 'restore'
      projects: 'Marketplace.slnx'

  # 3. Build all projects (incl. tests)
  - task: DotNetCoreCLI@2
    displayName: 'Build solution'
    inputs:
      command: 'build'
      projects: 'Marketplace.slnx'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  # 4. Unit tests  (no database used)
  - task: DotNetCoreCLI@2
    displayName: 'Run unit tests'
    inputs:
      command: 'test'
      projects: 'Backend/tests/Backend.UnitTests/Backend.UnitTests.csproj'
      arguments: '--configuration $(buildConfiguration) --no-build'
      publishTestResults: true

  # 5. Integration tests  (no database connection required)
  - task: DotNetCoreCLI@2
    displayName: 'Run integration tests'
    inputs:
      command: 'test'
      projects: 'Backend/tests/Backend.IntegrationTests/Backend.IntegrationTests.csproj'
      arguments: '--configuration $(buildConfiguration) --no-build'
      publishTestResults: true

  # ── Frontend ───────────────────────────────────────────────────────────────

  # 6. Node.js runtime
  - task: UseNode@1
    displayName: 'Install Node.js LTS'
    inputs:
      version: '22.x'

  # 7. Install npm dependencies
  - task: Npm@1
    displayName: 'Frontend: npm install'
    inputs:
      command: 'install'
      workingDir: 'Frontend'

  # 8. Lint (ESLint + TypeScript)
  - task: Npm@1
    displayName: 'Frontend: lint'
    inputs:
      command: 'custom'
      workingDir: 'Frontend'
      customCommand: 'run lint'

  # 9. Build
  - task: Npm@1
    displayName: 'Frontend: build'
    inputs:
      command: 'custom'
      workingDir: 'Frontend'
      customCommand: 'run build'

  # ── Docker ─────────────────────────────────────────────────────────────────

  # 10. Docker build + push
  #     Condition: all previous steps passed AND this is NOT a PR build.
  #     Build.Reason is 'PullRequest' for PR pipelines; 'IndividualCI' / 'BatchedCI' for merges.
  #     This prevents pushing an unreviewed image to DockerHub before the PR is merged.
  - task: Docker@2
    displayName: 'Build and Push Docker image'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      containerRegistry: 'dockerhub-connection' # from AZ devops Project Settings>Service connections
      repository: '$(imageName)'
      command: 'buildAndPush'
      Dockerfile: '**/Dockerfile'
      tags: |
        $(tag)
        latest
